[project]
name = "r2share"
version = "0.2.0"
description = "Share files from a private Cloudflare R2 bucket via signed links (CLI + agent skill)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
r2share = "r2share.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2share"]
